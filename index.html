<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnthroPrime — AI Infrastructure &amp; GPU Capacity Hub</title>
    <meta
      name="description"
      content="One accountable partner for AI infrastructure and GPU capacity — H100, H200, B200 and GB300 through a vetted network of cloud, data centre and power partners."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f5f4f1" />
    <script>
      /* Set theme before first paint to avoid a flash of the wrong theme. */
      ;(function () {
        try {
          var root = document.documentElement
          var saved = null
          try {
            saved = localStorage.getItem('ap-theme')
          } catch (e) {}
          var dark = saved === 'dark'
          root.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f182b' : '#f5f4f1')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <meta
      property="og:title"
      content="AnthroPrime — AI Infrastructure &amp; GPU Capacity Hub"
    />
    <meta
      property="og:description"
      content="One accountable partner for AI infrastructure and GPU capacity — H100, H200, B200 and GB300 through a vetted network of cloud, data centre and power partners."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnthroPrime" />
    <meta property="og:locale" content="en_GB" />
    <noscript
      ><style>
        /* Prerendered content stays visible without JavaScript (no scroll reveal). */
        #root [style*='opacity:0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body
    class="bg-bg text-text antialiased selection:bg-accent selection:text-bg"
  >
    <div id="root"></div>
    <noscript
      ><p style="padding: 16px; text-align: center">
        Forms and interactive diagrams need JavaScript. You can also contact
        <a href="mailto:hello@anthroprime.com">hello@anthroprime.com</a>
        directly.
      </p></noscript
    >
    <script type="module" src="/src/main.jsx"></script>
    <!-- Netlify form detection -->
    <form
      name="gpu-capacity"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="gpu-capacity" />
      <input
        type="hidden"
        name="subject"
        value="GPU capacity request — Anthroprime"
      />
      <input type="text" name="bot-field" />
      <input type="text" name="gpuType" />
      <input type="text" name="gpuQty" />
      <input type="text" name="location" />
      <input type="text" name="startDate" />
      <input type="text" name="duration" />
      <input type="text" name="workload" />
      <input type="text" name="deployType" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="consent" />
      <textarea name="brief"></textarea>
    </form>
    <form
      name="collaborator"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="collaborator" />
      <input type="hidden" name="subject" value="New collaborator" />
      <input type="text" name="bot-field" />
      <input type="text" name="company" />
      <input type="text" name="website" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="collaboratorType" />
      <textarea name="offer"></textarea>
      <input type="text" name="regions" />
      <input type="text" name="consent" />
    </form>
  </body>
</html>
